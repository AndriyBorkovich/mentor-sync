name: Deploy to Azure

on:
    workflow_run:
        workflows: ["Backend - build & test", "UI - build & test"]
        types:
            - completed

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
        env:
            AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
            AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
            AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
            AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
            AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
            AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10.0.x

            - name: Install azd
              uses: Azure/setup-azd@v2.0.0

            - name: Log in with Azure (Federated Credentials)
              if: ${{ env.AZURE_CLIENT_ID != '' }}
              run: |
                  azd auth login `
                    --client-id "$Env:AZURE_CLIENT_ID" `
                    --federated-credential-provider "github" `
                    --tenant-id "$Env:AZURE_TENANT_ID"
              shell: pwsh

            - name: Log in with Azure (Client Credentials)
              if: ${{ env.AZURE_CREDENTIALS != '' }}
              run: |
                  $info = $Env:AZURE_CREDENTIALS | ConvertFrom-Json -AsHashtable;
                  Write-Host "::add-mask::$($info.clientSecret)"

                  azd auth login `
                    --client-id "$($info.clientId)" `
                    --client-secret "$($info.clientSecret)" `
                    --tenant-id "$($info.tenantId)"
              shell: pwsh

            - name: Check env variables
              run: |
                  echo "AZD_INITIAL_ENVIRONMENT_CONFIG=$AZD_INITIAL_ENVIRONMENT_CONFIG"

            - name: Provision Infrastructure
              run: azd provision --no-prompt
              working-directory: aspire/MentorSync.AppHost
              env:
                  AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}

            - name: Refresh azd env (pulls latest infrastructure provision)
              run: azd env refresh --no-prompt
              env:
                  AZURE_LOCATION: ${{ env.AZURE_LOCATION }}
              working-directory: aspire/MentorSync.AppHost

            - name: Deploy Application
              run: azd deploy --no-prompt
              working-directory: aspire/MentorSync.AppHost
